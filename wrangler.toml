name = "ordiniapit"
main = ".open-next/worker.js"
compatibility_date = "2026-01-15"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

# Database D1: dopo aver creato il database con
#   wrangler d1 create po_manager_db
# incolla qui sotto il "database_id" restituito dal comando.
[[d1_databases]]
binding = "DB"
database_name = "po_manager_db"
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"

# Variabile segreta per firmare i cookie di sessione.
# In produzione impostala con:
#   wrangler secret put SESSION_SECRET
[vars]
SESSION_SECRET = "change-this-in-production-with-wrangler-secret"
